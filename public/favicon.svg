    font-size="33" 
    fill="#FAFAFA" 
    letter-spacing="-1.5"
  >JAYA</text>
  
  <!-- Hans Jaya Golden Egg Yolk Dot -->
  <circle cx="82" cy="72" r="7" fill="#FFC300" />
