<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Rounded solid dark charcoal background for maximum visibility in both light and dark browser themes -->
  <rect width="100" height="100" rx="16" fill="#1A1A1A" />
  
  <!-- "HANS" Text -->
  <text 
    x="50" 
    y="41" 
    dominant-baseline="middle" 
    text-anchor="middle" 
    font-family="system-ui, -apple-system, sans-serif" 
    font-weight="900" 
    font-size="33" 
    fill="#FAFAFA" 
    letter-spacing="-1.5"
